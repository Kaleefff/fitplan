[project]
name = "fitplan-backend"
version = "0.1.0"
description = "FitPlan Pro API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # D17: PostgreSQL driver for the async API and the sync Alembic/scripts
    "psycopg[binary]>=3.2",
    # D18: MongoDB async driver (AsyncMongoClient)
    "pymongo>=4.13",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # B-02: password hashing and access tokens (D4)
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# test vector tables stay one case per line
"tests/domain/test_nutrition.py" = ["E501"]
