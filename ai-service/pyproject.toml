[project]
name = "fitplan-ai-service"
version = "0.1.0"
description = "FitPlan Pro meal photo recognition (A-01, D25): a thin client of the Gemini API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # multipart form parsing for POST /predict
    "python-multipart>=0.0.9",
    # D25: Gemini API client
    "google-genai>=1.50",
    # photo check, EXIF orientation, resize, JPEG re-encode
    "pillow>=11.0",
    # app/gemini.py catches the timeouts of both transports google-genai can use;
    # httpx is also the TestClient transport
    "httpx>=0.27",
    "httpx2>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# same settings as backend/pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
