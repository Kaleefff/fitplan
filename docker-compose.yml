services:
  postgres:
    image: postgres:17
    container_name: fitplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.2.12
    container_name: fitplan-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fitplan-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PHOTO_DIR: /data/photos
      AI_SERVICE_URL: http://ai-service:8001
      # only ai-service holds the Gemini key (D25)
      GEMINI_API_KEY: ""
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - photo_data:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  scheduler:
    build: ./backend
    container_name: fitplan-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    # the image's HEALTHCHECK probes the API on :8000, which this service does not run
    healthcheck:
      disable: true
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      PHOTO_DIR: /data/photos
      GEMINI_API_KEY: ""
    volumes:
      - photo_data:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # A-01, D25: internal only (no host port); the backend calls it at http://ai-service:8001.
  # It gets the GEMINI_* variables and nothing else from .env (no database credentials).
  ai-service:
    build: ./ai-service
    container_name: fitplan-ai-service
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_S: ${GEMINI_TIMEOUT_S:-7}
      GEMINI_MEDIA_RESOLUTION: ${GEMINI_MEDIA_RESOLUTION:-medium}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
    expose:
      - "8001"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mailpit:
    image: axllent/mailpit:latest
    container_name: fitplan-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  mongo_data:
  photo_data:
